        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;

        }
        body, html {

        }

        /* প্লেয়ার কন্টেইনার - ফুল স্ক্রিন */
        #player-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* ভিডিও থাকবে সবার নিচে */
        }

        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; 
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* টিভি মাউসের জন্য বিশেষ মেনু বাটন */
        #menu-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5000; /* ভিডিওর উপরে থাকবে */
            padding: 12px 24px;
            background: rgba(255, 59, 48, 0.9);
            color: white;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }
        #menu-toggle-btn:hover {
            background: #ff3b30;
        }

        /* চ্যানেল মেনু প্যানেল */
        #menu-panel {
            position: absolute;
            top: 0;
            left: -100%; /* শুরুতে বামে লুকিয়ে থাকবে */
            width: 300px;
            height: 100%;
            background: rgba(10, 10, 10, 0.95); /* অন্ধকার ও ঘন করা হয়েছে যেন টিভি স্ক্রিনে ভালো দেখায় */
            border-right: 1px solid #333;
            z-index: 9999 !important; /* সবার উপরে থাকবে যেন মাউস ক্লিক পায় */
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        #menu-panel.open {
            left: 0;
        }
        .menu-header {
            padding: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .channel-item {
            padding: 15px;
            color: #ccc;
            background: rgba(255,255,255,0.05);
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
            border: 1px solid transparent;
        }
        /* মাউস কার্সার আইটেমের ওপর নিলে (Hover) বা রিমোট দিয়ে সিলেক্ট করলে */
        .channel-item:hover, .channel-item.focused {
            background: #ffffff !important;
            color: #000 !important;
            border: 1px solid #ff3b30;
        }
        .channel-item.active {
            background: #ff3b30;
            color: #fff;
            font-weight: bold;
        }

        /* টোস্ট নোটিফিকেশন */
        #toast {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            z-index: 6000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
        }

        let player;
        let currentChannelIndex = 0;
        let isMenuOpen = false;

        // প্লেয়ার চালু করা
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mute: false,
                chromeless: true, // টিভির জন্য ডিফল্ট কন্ট্রোল হাইড রাখা ভালো
                playback: {
                    playInline: true,
                    recycleVideo: true
                }
            });
        }

        // চ্যানেল প্লে করার ফাংশন
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            const channel = channels[index];
            
            if (player) {
                player.configure({ source: channel.url });
            } else {
                initPlayer(channel.url);
            }

            // অ্যাক্টিভ ক্লাস আপডেট
            document.querySelectorAll('.channel-item').forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            showToast(channel.name);
            hideMenu();
        }

        // মেনু কন্ট্রোল
        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
        }
        
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }

        // টোস্ট মেসেজ
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // চ্যানেল লিস্ট তৈরি (মাউস ক্লিকের জন্য 'click' ইভেন্ট ব্যবহার করা হয়েছে)
        const channelListContainer = document.getElementById('channelList');
        channels.forEach((channel, index) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerText = channel.name;
            
            // মাউস দিয়ে ক্লিক করলে চ্যানেল চলবে
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                playChannel(index);
            });
            
            channelListContainer.appendChild(item);
        });

        // লাল বাটনে মাউস দিয়ে ক্লিক করলে মেনু খুলবে/বন্ধ হবে
        document.getElementById('menu-toggle-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            if (isMenuOpen) {
                hideMenu();
            } else {
                showMenu();
            }
        });

        // ভিডিওর খালি জায়গায় মাউস দিয়ে ক্লিক করলে মেনু বন্ধ হয়ে যাবে
        document.getElementById('player-wrapper').addEventListener('click', () => {
            if (isMenuOpen) hideMenu();
        });

        // প্রথম চ্যানেল দিয়ে শুরু
        playChannel(0);
