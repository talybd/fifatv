            { name: "Quran HD", category: "Religion", url: "https://vodzong.mjunoon.tv:8087/streamtest/SaudiQuran-142/playlist.m3u8" },

            // Kids & Music
            { name: "ZB Cartun TV", category: "Kids", url: "https://server.zillarbarta.com/zbcatun/video.m3u8" },
            { name: "Music Bangla", category: "Kids", url: "https://app24.jagobd.com.bd/c3VydmVyX8RpbEU9Mi8xNy8yMFDEEHGcfRgzQ6NTAgdEoaeFzbF92YWxIZTO0U0ezN1IzMyfvcEdsEfeDeKiNkVN3PTOmdFseWRtaW51aiPhnPTI2/musicbangla2025.stream/playlist.m3u8" },
            { name: "Funny Junior", category: "Kids", url: "https://nomawnoijl.gpcdn.net/akash/funnyjunior/playlist.m3u8" },
            { name: "Nikki", category: "Kids", url: "https://nomawnoijl.gpcdn.net/akash/nikky/playlist.m3u8" },
            { name: "Moto Patlu", category: "Kids", url: "https://live20.bozztv.com/giatvplayout7/giatv-209902/tracks-v1a1/mono.ts.m3u8" },
            { name: "Tom and Jerry", category: "Kids", url: "https://live20.bozztv.com/giatvplayout7/giatv-208314/playlist.m3u8" },
            { name: "Toon Goggles", category: "Kids", url: "https://live.shamim-iptv.workers.dev/0toongoggles.m3u8" },
            { name: "Sangeet Bangla", category: "Kids", url: "https://cdn-4.pishow.tv/live/1143/master.m3u8" },

            // Radio
            { name: "Radio Bangla Net", category: "Radio", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/SP_R3563475_SC" },
            { name: "Spice FM", category: "Radio", url: "https://stream.spicefmbd.com/stream.m3u8" }
        ];

        let player;
        let currentCategory = "All";

        // ইন্টারফেস রেন্ডারিং ফাঙ্গশন
        function renderChannels(category) {
            const gridContainer = document.getElementById('channelGrid');
            gridContainer.innerHTML = "";
            
            const filtered = category === "All" ? allChannels : allChannels.filter(ch => ch.category === category);

            filtered.forEach((channel, index) => {
                const firstChar = channel.name.charAt(0).toUpperCase();
                const card = document.createElement('div');
                card.className = `channel-card ${index === 0 && category === "All" ? 'active' : ''}`;
                card.onclick = () => playChannel(channel, card);

                card.innerHTML = `
                    <div class="ch-icon">${firstChar}</div>
                    <div class="ch-info">
                        <div class="ch-title">${channel.name}</div>
                        <div class="ch-sub">${channel.category}</div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            if(filtered.length > 0 && player) {
                player.configure({ source: filtered[0].url });
                player.play();
            } else if (filtered.length > 0) {
                initPlayer(filtered[0].url);
            }
        }

        // প্লেয়ার ইনিশিয়েট (HLS/Dash সাপোর্টেড)
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                plugins: [DashShakaPlayback],
                shakaConfiguration: {
                    drm: { retryParameters: { maxAttempts: 4 } }
                },
                playback: { playInline: true, recycleVideo: true }
            });

            // রোটেশন ইভেন্ট লিসেনার সেটআপ করা
            setTimeout(setupAutoRotation, 1000);
        }

        // চ্যানেল সিলেক্ট
        function playChannel(channel, cardElement) {
            player.configure({ source: channel.url });
            player.play();

            document.querySelectorAll('.channel-card').forEach(card => card.classList.remove('active'));
            cardElement.classList.add('active');

            showOSD("📺 Playing: " + channel.name);
        }

        // ক্যাটাগরি ফিল্টার
        function filterCategory(category, buttonElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            currentCategory = category;
            renderChannels(category);
        }

        // ওএসডি নোটিফিকেশন 
        function showOSD(text) {
            const osd = document.getElementById('osd-alert');
            osd.innerText = text;
            osd.classList.add('show');
            setTimeout(() => osd.classList.remove('show'), 2000);
        }

        // 🔄 ফুলস্ক্রিন অটো-রোটেশন মেকানিজম (মোবাইল ফোনের জন্য)
        function setupAutoRotation() {
            const videoElement = document.querySelector('#player-wrapper video');
            if (!videoElement) return;

            // ফুলস্ক্রিন চেঞ্জ ট্র্যাকিং
            document.addEventListener('fullscreenchange', handleOrientation);
            document.addEventListener('webkitfullscreenchange', handleOrientation);

            function handleOrientation() {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
                
                if (isFullscreen) {
                    // ফুলস্ক্রিন হলে স্ক্রিন ল্যান্ডস্কেপ (Landscape) মোডে লক হবে
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(err => console.log("Orientation lock setup: ", err));
                    } else if (screen.lockOrientation) {
                        screen.lockOrientation('landscape');
                    }
                } else {
                    // ফুলস্ক্রিন থেকে বের হলে আবার নরমাল (Portrait) মোডে চলে আসবে
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            }
        }

        window.onload = () => {
            renderChannels(currentCategory);
        };
    </script>
</body>
</html>
