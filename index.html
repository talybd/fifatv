        * {
            margin: 0;

            box-sizing: border-box;
            user-select: none;

        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* প্লেয়ার কন্টেইনার - ফুল স্ক্রিন */
        #player-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ভিডিও এলিমেন্টকে জোরপূর্বক পুরো স্ক্রিনে ফিট/স্ট্রেচ করার CSS */
        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; /* স্ক্রিন পুরো ভরে যাবে, কোনো বর্ডার থাকবে না */
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* চ্যানেল মেনু প্যানেল */
        #menu-panel {
            position: absolute;
            top: 0;
            left: -100%; /* শুরুতে বামে লুকিয়ে থাকবে */
            width: 280px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10;
            transition: left 0.3s ease;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        #menu-panel.open {
            left: 0;
        }
        .menu-header {
            padding: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            text-align: center;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .channel-item {
            padding: 15px;
            color: #ccc;
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }
        .channel-item:hidden {
            display: none;
        }
        .channel-item.active {
            background: #ff3b30;
            color: #fff;
            font-weight: bold;
        }

        /* টোস্ট নোটিফিকেশন (চ্যানেল নাম দেখানোর জন্য) */
        #toast {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
        }
    </style>

        let player;
        let currentChannelIndex = 0;
        let isMenuOpen = false;

        // প্লেয়ার ইনিশিয়ালাইজেশন
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mute: false,
                chromeless: true, // ডিফল্ট কন্ট্রোল হাইড রাখা হয়েছে ফুল স্ক্রিন ফিল পাওয়ার জন্য
                playback: {
                    playInline: true,
                    recycleVideo: true
                }
            });
        }

        // চ্যানেল প্লে করার ফাংশন
        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            
            const channel = channels[index];
            
            if (player) {
                player.configure({ source: channel.url });
            } else {
                initPlayer(channel.url);
            }

            // অ্যাক্টিভ ক্লাস আপডেট
            document.querySelectorAll('.channel-item').forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            showToast(channel.name);
            hideMenu();
        }

        // মেনু ওপেন/ক্লোজ লজিক
        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
        }
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }

        // টোস্ট মেসেজ দেখানো
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // চ্যানেল লিস্ট তৈরি করা
        const channelListContainer = document.getElementById('channelList');
        channels.forEach((channel, index) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerText = channel.name;
            item.addEventListener('click', () => playChannel(index));
            channelListContainer.appendChild(item);
        });

        // প্রথম চ্যানেলটি দিয়ে শুরু করা
        playChannel(0);


        // ================= মোবাইল টাচ ও সোয়াইপ কন্ট্রোল লজিক (Touch Gesture) =================
        let touchstartX = 0;
        let touchendX = 0;
        let touchstartTime = 0;
        
        const playerWrapper = document.getElementById('player-wrapper');

        playerWrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartTime = new Date().getTime(); // টাচ শুরুর সময়
        }, { passive: true });

        playerWrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            let touchDuration = new Date().getTime() - touchstartTime; // কতক্ষণ টাচ ছিল
            
            handleGesture(touchDuration);
        }, { passive: true });

        function handleGesture(duration) {
            const swipeThreshold = 50; // কতটুকু টানলে সোয়াইপ কাউন্ট হবে (পিক্সেল)
            const clickTimeout = 250;  // ২৫০ মিলি-সেকেন্ডের কম হলে সেটি ক্লিক/ট্যাপ হিসেবে গণ্য হবে
            
            // ১. স্ক্রিনের মাঝখানে সিঙ্গেল ট্যাপ/টাচ করলে চ্যানেল লিস্ট আসবে-যাবে
            if (Math.abs(touchstartX - touchendX) < 10 && duration < clickTimeout) {
                if (isMenuOpen) {
                    hideMenu();
                } else {
                    showMenu();
                }
                return; // সোয়াইপ লজিক স্কিপ করার জন্য
            }
            
            // ২. ডান থেকে বামে সোয়াইপ (Next Channel)
            if (touchstartX - touchendX > swipeThreshold) {
                let next = currentChannelIndex + 1;
                playChannel(next < channels.length ? next : 0);
            }
            
            // ৩. বাম থেকে ডানে সোয়াইপ (Previous Channel)
            if (touchendX - touchstartX > swipeThreshold) {
                let prev = currentChannelIndex - 1;
                playChannel(prev >= 0 ? prev : channels.length - 1);
            }
        }
        // =============================================================================
    </script>
</body>
