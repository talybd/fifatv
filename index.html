            { n: "Music India", u: "aHR0cHM6Ly9jZG4tMi5waXNob3cudHYvbGl2ZS8yMjYvbWFzdGVyLm0zdTg=" },
            { n: "8X music", u: "aHR0cHM6Ly9tbC1wdWxsLWR2Yy1teWNvLmlvOjIwOTYvOFhNX01VU0lDL2luZGV4Lm0zdTg=" },
            { n: "ICC_9XM", u: "aHR0cHM6Ly93aXNlbHAud2lzZXBsYXlvdXQuY29tLzlYTS9IRDEwODAvSERKMTA4MC5tM3U4" }
        ];

        let channels = []; 
        let player;
        let currentChannelIndex = 0;
        let focusedChannelIndex = 0;
        let isMenuOpen = true;
        let skipTimeout;

        // 🔒 সিকিউরিটি লেয়ার ২: রাইট ক্লিক এবং কীবোর্ড শটকার্ট ব্লক (Inspect, Source)
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
                (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
                return false;
            }
        });

        // 🔒 সিকিউরিটি লেয়ার ৩: এন্টি-ডেভটুলস ডিবাগার লুপ (ইনস্পেক্ট করলে ট্যাব ক্রাশ করবে)
        setInterval(function() {
            (function() { return false; })['constructor']('debugger')();
        }, 50);

        function validateAndBuildChannels() {
            let validCount = 1;
            _0xData.forEach((ch) => {
                // Base64 ডিকোড রানটাইমে হচ্ছে
                let decryptedUrl = atob(ch.u).trim();
                if(decryptedUrl && !decryptedUrl.includes("cors-proxy")) {
                    channels.push({ id: validCount - 1, name: ch.n, url: decryptedUrl });
                    validCount++;
                }
            });
            renderChannels();
        }

        function renderChannels() {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = "";
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-item ${index === 0 ? 'focused active' : ''}`;
                card.id = `ch-${index}`;
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playChannel(index);
                });
                card.innerHTML = `<span class="ch-num">${index + 1}</span><span class="ch-name">${channel.name}</span>`;
                listContainer.appendChild(card);
            });
            if(channels.length > 0) initPlayer(channels[0].url);
        }

        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                chromeless: true,
                playback: { playInline: true, recycleVideo: true },
                events: {
                    onPlay: () => clearSkipTimer(),
                    onStop: () => clearSkipTimer(),
                    onError: () => autoSkipChannel(),
                    onBuffer: () => startSkipTimer()
                }
            });
            showMenu();
            autoFullscreenTV();
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            focusedChannelIndex = index;
            clearSkipTimer();
            
            player.configure({ source: channels[index].url });
            player.play();

            document.querySelectorAll('.channel-item').forEach((item, i) => {
                item.classList.remove('active');
                if (i === index) item.classList.add('active');
            });

            showOSD("📺 প্লে হচ্ছে: " + channels[index].name);
            hideMenu();
            startSkipTimer();
        }

        // ⏱️ অটো স্কিপ লজিক (৫ সেকেন্ড ডেড থাকলে স্কিপ হবে)
        function startSkipTimer() {
            clearSkipTimer();
            skipTimeout = setTimeout(() => {
                autoSkipChannel();
            }, 5000); 
        }

        function clearSkipTimer() {
            if (skipTimeout) clearTimeout(skipTimeout);
        }

        function autoSkipChannel() {
            clearSkipTimer();
            let nextIndex = currentChannelIndex + 1;
            if (nextIndex >= channels.length) nextIndex = 0;
            showOSD("⚠️ চ্যানেল অফলাইন! স্কিপ হচ্ছে...");
            setTimeout(() => {
                playChannel(nextIndex);
            }, 1000);
        }

        // ওএসডি ও মেনু ওপেন/ক্লোজ
        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
            updateFocusVisual();
        }
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }
        function toggleMenu() { if (isMenuOpen) hideMenu(); else showMenu(); }

        function showOSD(text) {
            const osd = document.getElementById('osd-alert');
            osd.innerText = text;
            osd.classList.add('show');
            setTimeout(() => osd.classList.remove('show'), 2500);
        }

        function updateFocusVisual() {
            document.querySelectorAll('.channel-item').forEach(btn => btn.classList.remove('focused'));
            const focusedElement = document.getElementById(`ch-${focusedChannelIndex}`);
            if (focusedElement) {
                focusedElement.classList.add('focused');
                focusedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // কীবোর্ড এবং রিমোট কন্ট্রোল
        document.addEventListener('keydown', function(event) {
            if (!isMenuOpen) {
                if (event.key === 'Enter' || event.keyCode === 13) { toggleMenu(); }
                if (event.key === 'ArrowUp' || event.keyCode === 38) { playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1); }
                if (event.key === 'ArrowDown' || event.keyCode === 40) { playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0); }
                return;
            }

            switch(event.key) {
                case 'ArrowUp': case 38:
                    event.preventDefault();
                    if (focusedChannelIndex > 0) focusedChannelIndex--;
                    updateFocusVisual();
                    break;
                case 'ArrowDown': case 40:
                    event.preventDefault();
                    if (focusedChannelIndex < channels.length - 1) focusedChannelIndex++;
                    updateFocusVisual();
                    break;
                case 'Enter': case 13:
                    event.preventDefault();
                    playChannel(focusedChannelIndex);
                    break;
                case 'Escape': case 'Back': case 461: case 27:
                    event.preventDefault();
                    hideMenu();
                    break;
            }
        });

        // ফুল স্ক্রিন ও মাউস ইভেন্ট
        const wrapper = document.getElementById('player-wrapper');
        let clickTimer;
        wrapper.addEventListener('click', function(e) {
            if (e.pointerType === 'touch') return;
            if (!clickTimer) {
                clickTimer = setTimeout(function() {
                    clickTimer = null;
                    toggleMenu();
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                handleFullscreen();
            }
        });

        function handleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function autoFullscreenTV() {
            document.body.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen();
            }, { once: true });
        }

        // মাউস হুইল ভলিউম কন্ট্রোল
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            let videoObj = wrapper.querySelector('video');
            if (videoObj) {
                if (e.deltaY < 0) { videoObj.volume = Math.min(1, videoObj.volume + 0.05); } 
                else { videoObj.volume = Math.max(0, videoObj.volume - 0.05); }
                showOSD("🔊 ভলিউম: " + Math.round(videoObj.volume * 100) + "%");
            }
        }, { passive: false });

        // মোবাইল সোয়াইপ এবং টাচ
        let touchstartX = 0, touchstartY = 0, touchendX = 0, touchendY = 0, touchstartTime = 0;
        wrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
            touchstartTime = new Date().getTime();
        }, { passive: true });

        wrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            let duration = new Date().getTime() - touchstartTime;
            
            if (Math.abs(touchstartX - touchendX) < 10 && Math.abs(touchstartY - touchendY) < 10 && duration < 250) {
                if (this.tappedTwice) {
                    handleFullscreen();
                    this.tappedTwice = false;
                    return;
                }
                this.tappedTwice = true;
                setTimeout(() => this.tappedTwice = false, 300);
                toggleMenu();
                return;
            }

            if (touchstartX - touchendX > 60) playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0);
            if (touchendX - touchstartX > 60) playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1);
        }, { passive: true });

        validateAndBuildChannels();
    </script>
</body>
</html>
