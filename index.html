<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maruf IPTV</title>
    <!-- Clappr Player Library -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    
    <!-- PWA Settings for Android/Chrome Install -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            /* মোবাইল সোয়াইপের সময় ব্রাউজারের ডিফল্ট রিফ্রেশ বা ব্যাক হওয়া বন্ধ করবে */
            touch-action: none; 
        }
        #player-wrapper {
            width: 100%;
            max-width: 800px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            aspect-ratio: 16 / 9;
            position: relative;
        }
        #player {
            width: 100%;
            height: 100%;
        }
        
        /* চ্যানেল লিস্ট ওভারলে */
        .channel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            z-index: 999;
            transition: opacity 0.3s ease;
            opacity: 1;
        }
        .channel-overlay.hidden {
            display: none;
            opacity: 0;
        }
        .overlay-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #3b82f6;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 5px;
        }
        .channel-btn {
            background-color: #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .channel-btn.focused {
            background-color: #334155;
            border-color: #3b82f6;
            transform: scale(1.02);
        }
        .channel-btn.active-stream {
            background-color: #1e3a8a;
        }
        .channel-num {
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-right: 15px;
            min-width: 35px;
            text-align: center;
        }
        .channel-name {
            font-size: 16px;
            font-weight: 500;
        }
        .info-bar {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- ভিডিও প্লেয়ার এবং লিস্ট ওভারলে কন্টেইনার -->
    <div id="player-wrapper">
        <div id="player"></div>
        
        <!-- চ্যানেলের তালিকা ওভারলে -->
        <div class="channel-overlay" id="menuOverlay">
            <div class="overlay-title">📺 Maruf IPTV - চ্যানেল লিস্ট</div>
            <div id="channelListContainer"></div>
        </div>
    </div>

    <div class="info-bar">
        💡 <b>রিমোট:</b> OK চাপলে লিস্ট আসবে/যাবে। <b>মোবাইল:</b> স্ক্রিনে ডানে-বামে সোয়াইপ (Swipe) করে চ্যানেল পরিবর্তন করুন।
    </div>

    <script>
        // আপনার চ্যানেলের লিস্ট (অবশ্যই পাবলিক HTTPS লিংক ব্যবহার করবেন অ্যাপে চালানোর জন্য)
        const channels = [
            { name: "TEST CHANNEL 1", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" },
            { name: "TEST CHANNEL 2", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" },
            { name: "NAGORIK TV (Demo)", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" },
            { name: "EKHON TV (Demo)", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" }
        ];

        let currentChannelIndex = 0;
        let focusedChannelIndex = 0;
        let isMenuOpen = true; 
        var player;

        // এইচটিএমএল-এ চ্যানেলের তালিকা তৈরি করা
        const listContainer = document.getElementById('channelListContainer');
        channels.forEach((channel, index) => {
            const btn = document.createElement('div');
            btn.className = `channel-btn ${index === 0 ? 'focused active-stream' : ''}`;
            btn.id = `ch-${index}`;
            btn.setAttribute('onclick', `clickPlayChannel(${index})`);
            btn.innerHTML = `<span class="channel-num">${index + 1}</span><span class="channel-name">${channel.name}</span>`;
            listContainer.appendChild(btn);
        });

        // প্লেয়ার লোড করা
        player = new Clappr.Player({
            source: channels[currentChannelIndex].url,
            parentId: "#player",
            width: '100%',
            height: '100%',
            autoPlay: true
        });

        function playChannel(index) {
            if (index >= 0 && index < channels.length) {
                currentChannelIndex = index;
                
                document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('active-stream'));
                document.getElementById(`ch-${index}`).classList.add('active-stream');

                player.load(channels[currentChannelIndex].url);
                player.play();
                
                hideMenu();

                let playerWrapper = document.getElementById("player-wrapper");
                if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
            }
        }

        function clickPlayChannel(index) {
            focusedChannelIndex = index;
            updateFocusVisual();
            playChannel(index);
        }

        function showMenu() {
            document.getElementById('menuOverlay').classList.remove('hidden');
            isMenuOpen = true;
            focusedChannelIndex = currentChannelIndex;
            updateFocusVisual();
        }

        function hideMenu() {
            document.getElementById('menuOverlay').classList.add('hidden');
            isMenuOpen = false;
        }

        function updateFocusVisual() {
            document.querySelectorAll('.channel-btn').forEach(btn => btn.classList.remove('focused'));
            const focusedElement = document.getElementById(`ch-${focusedChannelIndex}`);
            if (focusedElement) {
                focusedElement.classList.add('focused');
                focusedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // ================= মোবাইল সোয়াইপ কন্ট্রোল লজিক (Touch Gesture) =================
        let touchstartX = 0;
        let touchendX = 0;
        
        const playerWrapper = document.getElementById('player-wrapper');

        playerWrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        });

        playerWrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        });

        function handleGesture() {
            const swipeThreshold = 50; // কতটুকু টানলে সোয়াইপ কাউন্ট হবে (পিক্সেল)
            
            // ডান থেকে বামে সোয়াইপ (Next Channel)
            if (touchstartX - touchendX > swipeThreshold) {
                let next = currentChannelIndex + 1;
                playChannel(next < channels.length ? next : 0);
            }
            
            // বাম থেকে ডানে সোয়াইপ (Previous Channel)
            if (touchendX - touchstartX > swipeThreshold) {
                let prev = currentChannelIndex - 1;
                playChannel(prev >= 0 ? prev : channels.length - 1);
            }
        }
        // =============================================================================

        // রিমোট ও কীবোর্ড কন্ট্রোল
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                if (isMenuOpen) {
                    playChannel(focusedChannelIndex);
                } else {
                    showMenu();
                }
            } 
            else if (event.key === 'ArrowDown' || event.keyCode === 40) {
                event.preventDefault();
                if (isMenuOpen) {
                    if (focusedChannelIndex < channels.length - 1) focusedChannelIndex++;
                    else focusedChannelIndex = 0;
                    updateFocusVisual();
                } else {
                    let next = currentChannelIndex + 1;
                    playChannel(next < channels.length ? next : 0);
                }
            } 
            else if (event.key === 'ArrowUp' || event.keyCode === 38) {
                event.preventDefault();
                if (isMenuOpen) {
                    if (focusedChannelIndex > 0) focusedChannelIndex--;
                    else focusedChannelIndex = channels.length - 1;
                    updateFocusVisual();
                } else {
                    let prev = currentChannelIndex - 1;
                    playChannel(prev >= 0 ? prev : channels.length - 1);
                }
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
</html>
