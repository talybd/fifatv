<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARUF IPTV</title>
    
    <!-- Clappr Player Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.plainhtml5.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0f17;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* মেইন কন্টেইনার লেআউট */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 📺 লাইভ ভিডিও প্লেয়ার স্টাইল */
        #player-wrapper {
            width: 100%;
            background-color: #000;
            position: relative;
            z-index: 5;
        }
        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* 📋 চ্যানেল এরিয়া কন্টেইনার */
        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f121d;
        }

        /* 🏷️ চ্যানেল গ্রুপ ট্যাব (শুধুমাত্র ALL থাকবে) */
        .category-bar {
            width: 100%;
            padding: 12px 20px;
            background: #131722;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
        }
        .tab-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        /* 💎 চ্যানেল গ্রিড/লিস্ট কন্টেইনার */
        .channel-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .channel-grid {
            display: grid;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ==========================================================================
           🖥️ পিসি মোড স্টাইল (ডিফল্ট লার্জ স্ক্রিন)
           ========================================================================== */
        @media (min-width: 769px) {
            .app-container {
                height: 100vh;
            }
            #player-wrapper {
                height: 60vh; /* স্ক্রিনের ৬০% জুড়ে ভিডিও থাকবে */
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            }
            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
            /* পিসির জন্য প্রিমিয়াম ডার্ক কার্ড ডিজাইন */
            .channel-card {
                background: rgba(255, 255, 255, 0.04);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 15px;
                cursor: pointer;
                transition: all 0.25s ease;
            }
            .channel-card:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: #e50914;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(229, 9, 20, 0.15);
            }
            .channel-card.active {
                background: linear-gradient(135deg, #e50914, #b20710);
                border-color: #ff1e27;
                box-shadow: 0 6px 25px rgba(229, 9, 20, 0.4);
            }
            .ch-icon {
                width: 45px;
                height: 45px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                color: #e50914;
                font-size: 18px;
                flex-shrink: 0;
            }
            .channel-card.active .ch-icon {
                background: rgba(255, 255, 255, 0.2);
                color: #fff;
            }
            .ch-info {
                overflow: hidden;
            }
            .ch-title {
                font-size: 15px;
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ch-sub {
                font-size: 12px;
                color: #8892b0;
                margin-top: 2px;
            }
            .channel-card.active .ch-sub {
                color: rgba(255,255,255,0.7);
            }
        }

        /* ==========================================================================
           📱 মোবাইল মোড স্টাইল (অটো মোবাইল ভিউ স্ক্রিনশট অনুযায়ী)
           ========================================================================== */
        @media (max-width: 768px) {
            #player-wrapper {
                height: 30vh; /* মোবাইলের টপে ফিক্সড ভিডিও */
                position: sticky;
                top: 0;
            }
            .category-bar {
                padding: 10px 15px;
            }
            .channel-list-container {
                padding: 15px;
            }
            /* মোবাইল স্ক্রিনশটের মতো ৩ কলাম গোল বৃত্তাকার গ্রিড লেআউট */
            .channel-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px 10px;
            }
            .channel-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                cursor: pointer;
                background: transparent;
                border: none;
            }
            /* গোল আইকন মেকানিজম */
            .ch-icon {
                width: 75px;
                height: 75px;
                background: #ffffff;
                border-radius: 50%; /* পারফেক্ট গোল বাটন */
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                color: #222;
                font-size: 22px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
                transition: all 0.2s ease;
                border: 3px solid transparent;
                flex-shrink: 0;
            }
            /* একটিভ চ্যানেলে গ্লো ইফেক্ট */
            .channel-card.active .ch-icon {
                border-color: #3b82f6;
                box-shadow: 0 0 15px #3b82f6;
                transform: scale(1.05);
            }
            .ch-info {
                margin-top: 8px;
                width: 100%;
            }
            .ch-title {
                font-size: 13px;
                font-weight: 500;
                color: #e2e8f0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .ch-sub {
                font-size: 11px;
                color: #64748b;
                margin-top: 1px;
            }
        }

        /* ওএসডি নোটিফিকেশন */
        #osd-alert {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        #osd-alert.show { opacity: 1; }
        .channel-list-container::-webkit-scrollbar { width: 5px; }
        .channel-list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 📺 ভিডিও প্লেয়ার সেকশন -->
        <div id="player-wrapper"></div>

        <!-- 📋 কন্টেন্ট এবং লিস্ট সেকশন -->
        <div class="content-section">
            <!-- গ্রুপ ট্যাব বার -->
            <div class="category-bar">
                <button class="tab-btn">ALL</button>
            </div>

            <!-- চ্যানেল তালিকা -->
            <div class="channel-list-container">
                <div class="channel-grid" id="channelGrid"></div>
            </div>
        </div>
    </div>

    <!-- ওএসডি অ্যালার্ট ও পপআপ -->
    <div id="osd-alert">MARUF IPTV</div>

    <script>
        // চ্যানেল প্লেলিস্ট ডেটাবেস
        const allChannels = [
            { name: "Drama 24", url: "https://vods2.aynaott.com/gseriesDrama/tracks-v1a1/mono.ts.m3u8" },
            { name: "BTV National", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8" },
            { name: "Channel 1", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1702/output/index.m3u8" },
            { name: "Jamuna TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1701/output/index.m3u8" },
            { name: "DBC News HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1728/output/index.m3u8" },
            { name: "Maasranga TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1722/output/index.m3u8" },
            { name: "Ekattor HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1705/output/index.m3u8" },
            { name: "Channel 24 HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1703/output/index.m3u8" },
            { name: "ATN News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1706/output/index.m3u8" },
            { name: "News 24 HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1708/output/index.m3u8" },
            { name: "Star News", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1710/output/index.m3u8" },
            { name: "Islamic TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1724/output/index.m3u8" },
            { name: "Deepto TV HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1711/output/index.m3u8" },
            { name: "Channel 9 HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1729/output/index.m3u8" },
            { name: "Channel I HD", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1723/output/index.m3u8" },
            { name: "Bangla Vision", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1715/output/index.m3u8" },
            { name: "NTV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1716/output/index.m3u8" },
            { name: "Al Jazeera", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1721/output/index.m3u8" },
            { name: "Al Quran", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1713/output/index.m3u8" },
            { name: "Independent TV", url: "https://owrcovcrpy.gpcdn.net/bpk-tv/1704/output/index.m3u8" },
            { name: "Willow Sports", url: "https://d36r8jifhgsk5j.cloudfront.net/Willow_TV.m3u8" },
            { name: "T Sports", url: "https://flussonic.deltainfonet.com/01_Tsports_HD/tracks-v1a1/mono.m3u8" }
        ];

        let player;
        const gridContainer = document.getElementById('channelGrid');

        // লোড হওয়ার সাথে সাথে চ্যানেল ইন্টারফেস বিল্ড করা
        function initApp() {
            gridContainer.innerHTML = "";
            allChannels.forEach((channel, index) => {
                // নামের প্রথম অক্ষর আইকনে দেখানোর জন্য ফিল্টার করা
                const firstChar = channel.name.charAt(0).toUpperCase();
                
                const card = document.createElement('div');
                card.className = `channel-card ${index === 0 ? 'active' : ''}`;
                card.id = `channel-${index}`;
                card.onclick = () => playChannel(index);

                card.innerHTML = `
                    <div class="ch-icon">${firstChar}</div>
                    <div class="ch-info">
                        <div class="ch-title">${channel.name}</div>
                        <div class="ch-sub">MARUF IPTV</div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            // ১ম চ্যানেলটি দিয়ে প্লেয়ার রান করা
            if(allChannels.length > 0) {
                initPlayer(allChannels[0].url);
            }
        }

        // প্লেয়ার কাস্টমাইজেশন ট্রিগার
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                playback: { playInline: true, recycleVideo: true }
            });
        }

        // চ্যানেল পরিবর্তনের ফাঙ্গশন
        function playChannel(index) {
            if (index < 0 || index >= allChannels.length) return;
            
            player.configure({ source: allChannels[index].url });
            player.play();

            // একটিভ ক্লাসের ইন্টারফেস পরিবর্তন
            document.querySelectorAll('.channel-card').forEach((card, i) => {
                if(i === index) {
                    card.classList.add('active');
                    card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    card.classList.remove('active');
                }
            });

            showOSD("📺 Now Playing: " + allChannels[index].name);
        }

        // ওএসডি পপআপ টেক্সট রানার
        function showOSD(text) {
            const osd = document.getElementById('osd-alert');
            osd.innerText = text;
            osd.classList.add('show');
            setTimeout(() => osd.classList.remove('show'), 2500);
        }

        // রানিং অ্যাপ স্টার্টার
        window.onload = initApp;
    </script>
</body>
</html>
