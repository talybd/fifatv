    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* প্লেয়ার কন্টেইনার */
        #player-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: pointer;
        }
        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; /* ফুল স্ক্রিন অটো ফিট */
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* 💎 বাম পাশের প্রিমিয়াম গ্লাস চ্যানেল মেনু প্যানেল */
        #menu-panel {
            position: absolute;
            top: 0;
            left: -320px; /* শুরুতে বামে লুকিয়ে থাকবে */
            width: 320px;
            height: 100%;
            background: rgba(10, 15, 30, 0.75); /* ডার্ক লাক্সারি কাচ */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #menu-panel.open {
            left: 0; /* স্ক্রিনে আসলে বাম পাশে সেট হবে */
        }
        .menu-header {
            padding: 25px 20px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .menu-header span {
            color: #3b82f6;
            display: block;
            font-size: 12px;
            margin-top: 4px;
        }
        
        /* চ্যানেল লিস্টের ভার্টিকাল স্ক্রোল ভিউ */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* 💎 প্রিমিয়াম চ্যানেল আইটেম ডিজাইন */
        .channel-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            color: #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .channel-item .ch-num {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 6px;
            min-width: 28px;
            text-align: center;
        }
        .channel-item .ch-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* পিসি হোভার এবং টিভি রিমোট ফোকাস ইফেক্ট */
        .channel-item:hover, .channel-item.focused {
            background: rgba(255, 255, 255, 0.15);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transform: translateX(4px); /* আলতো ডানদিকে সরবে */
            color: #fff;
        }
        
        /* অ্যাক্টিভ বা রানিং চ্যানেল */
        .channel-item.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-color: #60a5fa;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            color: #fff;
            font-weight: bold;
        }
        .channel-item.active .ch-num {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        /* ইন্ডিকেটর ও নোটিফিকেশন ওএসডি */
        #osd-alert {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #osd-alert.show { opacity: 1; }

        /* কাস্টম স্ক্রোলবার */
        .channel-list::-webkit-scrollbar { width: 4px; }
        .channel-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    </style>

        let channels = []; // শুধুমাত্র অ্যাক্টিভ চ্যানেল ফিল্টার হবে
        let player;
        let currentChannelIndex = 0;
        let focusedChannelIndex = 0;
        let isMenuOpen = true;

        // 🛡️ ইন-অ্যাক্টিভ ও ডেড লিংক ফিল্টারিং লজিক
        function validateAndBuildChannels() {
            let validCount = 1;
            allChannels.forEach((ch) => {
                if(ch.url && !ch.url.includes("cors-proxy") && !ch.name.includes("Unknown")) {
                    channels.push({
                        id: validCount - 1,
                        name: ch.name,
                        url: ch.url
                    });
                    validCount++;
                }
            });
            renderChannels();
        }

        // সাইডবারে চ্যানেল লিস্ট তৈরি
        function renderChannels() {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = "";
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-item ${index === 0 ? 'focused active' : ''}`;
                card.id = `ch-${index}`;
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playChannel(index);
                });
                card.innerHTML = `<span class="ch-num">${index + 1}</span><span class="ch-name">${channel.name}</span>`;
                listContainer.appendChild(card);
            });
            
            if(channels.length > 0) initPlayer(channels[0].url);
        }

        // প্লেয়ার ইনিশিয়ালাইজেশন
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                chromeless: true,
                playback: { playInline: true, recycleVideo: true }
            });
            showMenu();
            autoFullscreenTV();
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            focusedChannelIndex = index;
            
            player.configure({ source: channels[index].url });
            player.play();

            document.querySelectorAll('.channel-item').forEach((item, i) => {
                item.classList.remove('active');
                if (i === index) item.classList.add('active');
            });

            showOSD("📺 প্লে হচ্ছে: " + channels[index].name);
            hideMenu();
        }

        // ওএসডি কন্ট্রোল
        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
            updateFocusVisual();
        }
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }
        function toggleMenu() { if (isMenuOpen) hideMenu(); else showMenu(); }

        function showOSD(text) {
            const osd = document.getElementById('osd-alert');
            osd.innerText = text;
            osd.classList.add('show');
            setTimeout(() => osd.classList.remove('show'), 2000);
        }

        function updateFocusVisual() {
            document.querySelectorAll('.channel-item').forEach(btn => btn.classList.remove('focused'));
            const focusedElement = document.getElementById(`ch-${focusedChannelIndex}`);
            if (focusedElement) {
                focusedElement.classList.add('focused');
                focusedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // 🖥️ টিভি রিমোট ও পিসি কীবোর্ড কন্ট্রোল লজিক (Up/Down/Left/Right/OK)
        document.addEventListener('keydown', function(event) {
            if (!isMenuOpen) {
                if (event.key === 'Enter' || event.keyCode === 13) { toggleMenu(); }
                if (event.key === 'ArrowUp' || event.keyCode === 38) { playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1); }
                if (event.key === 'ArrowDown' || event.keyCode === 40) { playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0); }
                return;
            }

            switch(event.key) {
                case 'ArrowUp': case 38:
                    event.preventDefault();
                    if (focusedChannelIndex > 0) focusedChannelIndex--;
                    updateFocusVisual();
                    break;
                case 'ArrowDown': case 40:
                    event.preventDefault();
                    if (focusedChannelIndex < channels.length - 1) focusedChannelIndex++;
                    updateFocusVisual();
                    break;
                case 'Enter': case 13:
                    event.preventDefault();
                    playChannel(focusedChannelIndex);
                    break;
                case 'Escape': case 'Back': case 461: case 27:
                    event.preventDefault();
                    hideMenu();
                    break;
            }
        });

        // 📱 মাউস ক্লিক এবং ডাবল ক্লিক ফুল স্ক্রিন
        const wrapper = document.getElementById('player-wrapper');
        let clickTimer;
        wrapper.addEventListener('click', function(e) {
            if (e.pointerType === 'touch') return;
            if (!clickTimer) {
                clickTimer = setTimeout(function() {
                    clickTimer = null;
                    toggleMenu();
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                handleFullscreen();
            }
        });

        function handleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        function autoFullscreenTV() {
            document.body.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen();
            }, { once: true });
        }

        // 🔊 পিসিতে মাউসের চাকা ঘুরিয়ে সাউন্ড কন্ট্রোল
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            let videoObj = wrapper.querySelector('video');
            if (videoObj) {
                if (e.deltaY < 0) {
                    videoObj.volume = Math.min(1, videoObj.volume + 0.05);
                } else {
                    videoObj.volume = Math.max(0, videoObj.volume - 0.05);
                }
                showOSD("🔊 ভলিউম: " + Math.round(videoObj.volume * 100) + "%");
            }
        }, { passive: false });

        // 📱 মোবাইলে টাচ ও সোয়াইপ জেসচার
        let touchstartX = 0, touchstartY = 0, touchendX = 0, touchendY = 0, touchstartTime = 0;
        
        wrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
            touchstartTime = new Date().getTime();
        }, { passive: true });

        wrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            let duration = new Date().getTime() - touchstartTime;
            
            // মোবাইল ডাবল ট্যাপ ফুল স্ক্রিন
            if (Math.abs(touchstartX - touchendX) < 10 && Math.abs(touchstartY - touchendY) < 10 && duration < 250) {
                if (this.tappedTwice) {
                    handleFullscreen();
                    this.tappedTwice = false;
                    return;
                }
                this.tappedTwice = true;
                setTimeout(() => this.tappedTwice = false, 300);
                toggleMenu();
                return;
            }

            // সোয়াইপ (ডানে-বামে চ্যানেল চেঞ্জ)
            if (touchstartX - touchendX > 60) playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0);
            if (touchendX - touchstartX > 60) playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1);
        }, { passive: true });

        // রান করার শুরুতে এক্সিকিউশন
        validateAndBuildChannels();
    </script>
