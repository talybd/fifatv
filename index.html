            font-weight: bold;

        let channels = []; // শুধুমাত্র অ্যাক্টিভ চ্যানেলগুলো এখানে ফিল্টার হয়ে জমা হবে
        let player;
        let currentChannelIndex = 0;
        let focusedChannelIndex = 0;
        let isMenuOpen = true;

        // 🛡️ ফিল্টারিং লজিক: ইন-অ্যাক্টিভ ও ডেড লিংক বাদ দেওয়া
        function validateAndBuildChannels() {
            let validCount = 1;
            allChannels.forEach((ch) => {
                // যে লিংকগুলো ফাঁকা, কর্স প্রক্সি ছাড়া ডেড বা ভুল ফরম্যাট সেগুলোকে ফিল্টার করা হচ্ছে
                if(ch.url && !ch.url.includes("cors-proxy") && !ch.name.includes("Unknown")) {
                    channels.push({
                        id: validCount - 1,
                        name: ch.name,
                        url: ch.url
                    });
                    validCount++;
                }
            });
            renderChannels();
        }

        // এইচটিএমএল-এ প্রফেশনাল গ্রিড লিস্ট তৈরি
        function renderChannels() {
            const listContainer = document.getElementById('channelList');
            listContainer.innerHTML = "";
            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = `channel-item ${index === 0 ? 'focused active' : ''}`;
                card.id = `ch-${index}`;
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    playChannel(index);
                });
                card.innerHTML = `<span class="ch-num">${index + 1}</span><span class="ch-name">${channel.name}</span>`;
                listContainer.appendChild(card);
            });
            
            // প্রথম অ্যাক্টিভ চ্যানেল প্লে করা
            if(channels.length > 0) initPlayer(channels[0].url);
        }

        // প্লেয়ার ইনিশিয়ালাইজেশন
        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                chromeless: true, // ফুল ক্লিয়ার স্ক্রিন
                playback: { playInline: true, recycleVideo: true }
            });
            showMenu();
            autoFullscreenTV();
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            focusedChannelIndex = index;
            
            player.configure({ source: channels[index].url });
            player.play();

            document.querySelectorAll('.channel-item').forEach((item, i) => {
                item.classList.remove('active');
                if (i === index) item.classList.add('active');
            });

            showOSD("📺 প্লে হচ্ছে: " + channels[index].name);
            hideMenu();
        }

        // ওএসডি কন্ট্রোল
        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
            updateFocusVisual();
        }
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }
        function toggleMenu() { if (isMenuOpen) hideMenu(); else showMenu(); }

        function showOSD(text) {
            const osd = document.getElementById('osd-alert');
            osd.innerText = text;
            osd.classList.add('show');
            setTimeout(() => osd.classList.remove('show'), 2000);
        }

        function updateFocusVisual() {
            document.querySelectorAll('.channel-item').forEach(btn => btn.classList.remove('focused'));
            const focusedElement = document.getElementById(`ch-${focusedChannelIndex}`);
            if (focusedElement) {
                focusedElement.classList.add('focused');
                focusedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // 🖥️ টিভি রিমোট ও পিসি কীবোর্ড কন্ট্রোল লজিক
        document.addEventListener('keydown', function(event) {
            if (!isMenuOpen) {
                if (event.key === 'Enter' || event.keyCode === 13) { toggleMenu(); }
                // রিমোটের Up/Down বাটন দিয়ে সরাসরি চ্যানেল চেঞ্জ যখন ওএসডি বন্ধ থাকে
                if (event.key === 'ArrowUp' || event.keyCode === 38) { playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1); }
                if (event.key === 'ArrowDown' || event.keyCode === 40) { playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0); }
                return;
            }

            // মেনু খোলা থাকা অবস্থায় রিমোট কন্ট্রোল গ্রিড নেভিগেশন
            switch(event.key) {
                case 'ArrowUp': case 38:
                    event.preventDefault();
                    if (focusedChannelIndex - 4 >= 0) focusedChannelIndex -= 4; // ৪ কলাম গ্রিড স্টেপ
                    updateFocusVisual();
                    break;
                case 'ArrowDown': case 40:
                    event.preventDefault();
                    if (focusedChannelIndex + 4 < channels.length) focusedChannelIndex += 4;
                    updateFocusVisual();
                    break;
                case 'ArrowLeft': case 37:
                    event.preventDefault();
                    if (focusedChannelIndex > 0) focusedChannelIndex--;
                    updateFocusVisual();
                    break;
                case 'ArrowRight': case 39:
                    event.preventDefault();
                    if (focusedChannelIndex < channels.length - 1) focusedChannelIndex++;
                    updateFocusVisual();
                    break;
                case 'Enter': case 13:
                    event.preventDefault();
                    playChannel(focusedChannelIndex);
                    break;
                case 'Escape': case 'Back': case 461: case 27: // ব্যাক বাটন সাপোর্ট
                    event.preventDefault();
                    hideMenu();
                    break;
            }
        });

        // 📱 ডাবল ক্লিক/ট্যাপ ফুল স্ক্রিন এবং সাউন্ড স্ক্রোল মেকানিজম
        const wrapper = document.getElementById('player-wrapper');
        
        // সিঙ্গেলে মেনু ওপেন, ডাবল ক্লিকে ফুল স্ক্রিন
        let clickTimer;
        wrapper.addEventListener('click', function(e) {
            if (e.pointerType === 'touch') return;
            if (!clickTimer) {
                clickTimer = setTimeout(function() {
                    clickTimer = null;
                    toggleMenu();
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                handleFullscreen();
            }
        });

        function handleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // টিভিতে অটোমেটিক ফুল স্ক্রিন করার ট্রিগার
        function autoFullscreenTV() {
            document.body.addEventListener('click', () => {
                if (!document.fullscreenElement) wrapper.requestFullscreen();
            }, { once: true });
        }

        // 🔊 পিসিতে মাউসের চাকা ঘুরিয়ে সাউন্ড কন্ট্রোল (Mouse Wheel Volume)
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();
            let videoObj = wrapper.querySelector('video');
            if (videoObj) {
                if (e.deltaY < 0) {
                    videoObj.volume = Math.min(1, videoObj.volume + 0.05);
                } else {
                    videoObj.volume = Math.max(0, videoObj.volume - 0.05);
                }
                showOSD("🔊 ভলিউম: " + Math.round(videoObj.volume * 100) + "%");
            }
        }, { passive: false });

        // 📱 মোবাইলে টাচ ও সোয়াইপ জেসচার
        let touchstartX = 0, touchstartY = 0, touchendX = 0, touchendY = 0, touchstartTime = 0;
        
        wrapper.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
            touchstartTime = new Date().getTime();
        }, { passive: true });

        wrapper.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            let duration = new Date().getTime() - touchstartTime;
            
            // মোবাইল ডাবল ট্যাপ ফুল স্ক্রিন চেক
            if (Math.abs(touchstartX - touchendX) < 10 && Math.abs(touchstartY - touchendY) < 10 && duration < 250) {
                if (this.tappedTwice) {
                    handleFullscreen();
                    this.tappedTwice = false;
                    return;
                }
                this.tappedTwice = true;
                setTimeout(() => this.tappedTwice = false, 300);
                toggleMenu();
                return;
            }

            // সোয়াইপ লজিক (ডানে-বামে চ্যানেল চেঞ্জ)
            if (touchstartX - touchendX > 60) playChannel(currentChannelIndex + 1 < channels.length ? currentChannelIndex + 1 : 0);
            if (touchendX - touchstartX > 60) playChannel(currentChannelIndex - 1 >= 0 ? currentChannelIndex - 1 : channels.length - 1);
        }, { passive: true });

        // স্ক্রিপ্ট রান করার শুরুতে চ্যানেল লিস্ট জেনারেট ও চেক
        validateAndBuildChannels();
    </script>
</body>
</html>
