<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>টিভি মাউস ফিক্স প্লেয়ার</title>
    
    <!-- Clappr Player Script -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.plainhtml5.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* প্লেয়ার কন্টেইনার */
        #player-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; 
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* স্ক্রিনের যেকোনো জায়গায় মাউস ক্লিক নেওয়ার জন্য একটি অদৃশ্য লেয়ার */
        #click-catcher {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500; /* ভিডিওর উপরে কিন্তু মেনুর নিচে */
            background: transparent;
        }

        /* চ্যানেল মেনু প্যানেল */
        #menu-panel {
            position: absolute;
            top: 0;
            left: -100%;
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.98);
            border-right: 3px solid #ff3b30;
            z-index: 9999 !important;
            transition: left 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        #menu-panel.open {
            left: 0;
        }
        .menu-header {
            padding: 25px 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid #222;
            text-align: center;
            background: #111;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .channel-item {
            padding: 18px;
            color: #fff;
            background: #222;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 22px;
            text-align: center;
            border: 2px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        /* কার্সার উপরে নিলে বা সিলেক্ট হলে */
        .channel-item:hover, .channel-item.focused {
            background: #ff3b30 !important;
            color: #fff !important;
            border: 2px solid #fff;
        }
        .channel-item.active {
            border-left: 8px solid #ff3b30;
            background: #1a1a1a;
        }

        /* টোস্ট নোটিফিকেশন */
        #toast {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff3b30;
            color: #fff;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            z-index: 6000;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Clappr প্লেয়ার -->
    <div id="player-wrapper"></div>
    
    <!-- মাউস ক্লিক ক্যাচার -->
    <div id="click-catcher"></div>

    <!-- চ্যানেল মেনু -->
    <div id="menu-panel">
        <div class="menu-header">📺 চ্যানেল লিস্ট</div>
        <div class="channel-list" id="channelList"></div>
    </div>

    <!-- নোটিফিকেশন -->
    <div id="toast"></div>

    <script>
        const channels = [
            { name: "T Sports Live", url: "https://biostartvworld.pages.dev/api/t-sports.m3u8?key=aHR0cHM6Ly90di5iZXlvbmR0YXhjb25zdWx0YW50cy5jb20vYXBpL3Byb3h5P3VybD1odHRwOi8vMTAzLjE2NS45My4zMTo4MDk1L3RzcG9ydHMvdHJhY2tzLXYxYTFhMi9tb25vLm0zdTg" },
            { name: "চ্যানেল ২", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" },
            { name: "চ্যানেল ৩", url: "https://mnmedias.api.telequebec.tv/m3u8/29880.m3u8" }
        ];

        let player;
        let currentChannelIndex = 0;
        let isMenuOpen = false;

        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mute: false,
                chromeless: true,
                playback: { playInline: true, recycleVideo: true }
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            const channel = channels[index];
            
            if (player) {
                player.configure({ source: channel.url });
            } else {
                initPlayer(channel.url);
            }

            document.querySelectorAll('.channel-item').forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            showToast(channel.name);
            hideMenu();
        }

        function toggleMenu() {
            if (isMenuOpen) hideMenu();
            else showMenu();
        }

        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
        }
        
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // চ্যানেল লিস্ট তৈরি (Hover এবং Click দুটোই সাপোর্ট করবে)
        const channelListContainer = document.getElementById('channelList');
        channels.forEach((channel, index) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerText = channel.name;
            
            // মাউসের ডট উপরে নিয়ে ক্লিক করলে
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                playChannel(index);
            });
            
            channelListContainer.appendChild(item);
        });

        // ফুল স্ক্রিনে মাউসের ডট দিয়ে যেকোনো জায়গায় ১ বার ক্লিক করলে মেনু আসবে/যাবে
        document.getElementById('click-catcher').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
        });

        // প্রথম চ্যানেল প্লে
        playChannel(0);

        // ================== এয়ার মাউস / ফ্রিজ রিমোট ফিক্সার ==================
        
        // ট্রিক ১: যদি মাউস মোডে রিমোটের বাটনে চাপ দেওয়ার পর তা মাউস হুইল (Scroll) হিসেবে কাজ করে
        window.addEventListener('wheel', function(e) {
            if (!isMenuOpen) {
                showMenu();
            } else {
                // মেনু খোলা থাকলে আপ-ডাউন স্ক্রল করাবে
                document.querySelector('.channel-list').scrollTop += e.deltaY;
            }
        });

        // ট্রিক ২: ইউনিভার্সাল কিবোর্ড ইভেন্ট ব্যাকআপ (যদি মাউস মোড ছাড়া কাজ করে)
        document.addEventListener('keydown', function(e) {
            const code = e.keyCode || e.which;
            if (code === 13 || code === 38 || code === 40 || code === 37 || code === 39) {
                if (!isMenuOpen) showMenu();
            }
        });
        // =========================================================================
    </script>
</body>
</html>
