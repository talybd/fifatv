        let player;
        let isStretched = false;

        // লোড হওয়ার সাথে সাথে গ্রিড চ্যানেল তৈরি করবে
        function initApp() {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            liveChannels.forEach((channel, idx) => {
                const card = document.createElement('div');
                card.className = `channel-card ${idx === 0 ? 'active' : ''}`;
                card.setAttribute('onclick', `switchChannel(${idx})`);
                
                let liveBadge = channel.live ? `<span class="live-badge">LIVE</span>` : '';
                
                card.innerHTML = `
                    ${liveBadge}
                    <div class="channel-thumb">
                        <img src="${channel.logo}" alt="${channel.name}">
                    </div>
                    <div class="channel-title">${channel.name}</div>
                `;
                grid.appendChild(card);
            });

            // প্রথম চ্যানেল দিয়ে প্লেয়ার চালু
            setupPlayer(liveChannels[0].url);
        }

        // Clappr প্লেয়ার সেটআপ 
        function setupPlayer(streamUrl) {
            if (player) {
                player.destroy();
            }
            player = new Clappr.Player({
                source: streamUrl,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                playback: {
                    playInline: true,
                    recycleVideo: true
                }
            });
        }

        // ক্লিক করলে নতুন চ্যানেল প্লে হবে এবং ডিটেইলস আপডেট হবে
        function switchChannel(index) {
            const targetChannel = liveChannels[index];
            
            // প্লেয়ার সোর্স পরিবর্তন
            setupPlayer(targetChannel.url);

            // UI ইনফো আপডেট
            document.getElementById('currentTitle').innerText = targetChannel.name;
            document.getElementById('currentLogo').innerHTML = `<img src="${targetChannel.logo}" alt="logo">`;

            // একটিভ ক্লাস আপডেট
            const cards = document.querySelectorAll('.channel-card');
            cards.forEach((card, idx) => {
                if(idx === index) card.classList.add('active');
                else card.classList.remove('active');
            });
        }

        // সার্চ ফাংশন
        function filterChannels() {
            const query = document.getElementById('searchChannel').value.toLowerCase();
            const cards = document.querySelectorAll('.channel-card');
            
            cards.forEach((card, index) => {
                const channelName = liveChannels[index].name.toLowerCase();
                if(channelName.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // স্ট্রেচ বাটন ফিট টগল লজিক
        function toggleStretch() {
            const videoElement = document.querySelector('#player-wrapper video');
            if (videoElement) {
                if (!isStretched) {
                    videoElement.style.objectFit = 'fill';
                    isStretched = true;
                } else {
                    videoElement.style.objectFit = 'contain';
                    isStretched = false;
                }
            }
        }

        // উইন্ডো লোড হলে রান হবে
        window.onload = initApp;
    </script>
