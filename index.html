    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* প্লেয়ার ফুল স্ক্রিন */
        #player-wrapper {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #player-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; 
        }
        [data-player] {
            width: 100% !important;
            height: 100% !important;
        }

        /* চ্যানেল মেনু প্যানেল */
        #menu-panel {
            position: absolute;
            top: 0;
            left: -100%; /* শুরুতে হাইড থাকবে */
            width: 320px;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            border-right: 2px solid #ff3b30;
            z-index: 9999;
            transition: left 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
        }
        #menu-panel.open {
            left: 0; /* রিমোটে ওকে চাপলে বাম থেকে আসবে */
        }
        .menu-header {
            padding: 25px 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid #222;
            text-align: center;
            background: #111;
        }
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        .channel-item {
            padding: 16px;
            color: #aaa;
            background: rgba(255,255,255,0.03);
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 20px; /* টিভির জন্য ফন্ট বড় করা হয়েছে */
            border: 2px solid transparent;
            transition: all 0.1s ease;
        }
        /* রিমোটের আপ-ডাউন বাটন দিয়ে সিলেক্ট করলে (ফোকাস) */
        .channel-item.focused {
            background: #ffffff !important;
            color: #000 !important;
            border: 2px solid #ff3b30;
            transform: scale(1.02);
            font-weight: bold;
        }
        /* বর্তমানে যে চ্যানেলটি চলছে */
        .channel-item.active {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            border-left: 5px solid #ff3b30;
        }

        /* রিমোট গাইড পপআপ (টিভি চালু হলে দেখাবে রিমোটের কোন বাটনে কি কাজ) */
        #remote-guide {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 5000;
            border: 1px solid #444;
            pointer-events: none;
        }

        /* টোস্ট নোটিফিকেশন */
        #toast {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.95);
            color: #fff;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            z-index: 6000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #toast.show {
            opacity: 1;
        }
    </style>

        let player;
        let currentChannelIndex = 0; // বর্তমানে কোন চ্যানেল চলছে
        let focusedIndex = 0;        // মেনুর ভেতর রিমোটের লাল ফোকাস কোথায় আছে
        let isMenuOpen = false;

        function initPlayer(url) {
            player = new Clappr.Player({
                source: url,
                parentId: "#player-wrapper",
                width: "100%",
                height: "100%",
                autoPlay: true,
                mute: false,
                chromeless: true,
                playback: { playInline: true, recycleVideo: true }
            });
        }

        function playChannel(index) {
            if (index < 0 || index >= channels.length) return;
            currentChannelIndex = index;
            const channel = channels[index];
            
            if (player) {
                player.configure({ source: channel.url });
            } else {
                initPlayer(channel.url);
            }

            // অ্যাক্টিভ চ্যানেল মার্ক করা
            document.querySelectorAll('.channel-item').forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            showToast("প্লে হচ্ছে: " + channel.name);
            hideMenu();
        }

        function showMenu() {
            document.getElementById('menu-panel').classList.add('open');
            isMenuOpen = true;
            focusedIndex = currentChannelIndex; // মেনু খুললে রানিং চ্যানেলের ওপর ফোকাস যাবে
            updateFocusUI();
        }
        
        function hideMenu() {
            document.getElementById('menu-panel').classList.remove('open');
            isMenuOpen = false;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // রিমোট ফোকাস ইন্টারফেস আপডেট ও অটো-স্ক্রলিং লজিক
        function updateFocusUI() {
            const items = document.querySelectorAll('.channel-item');
            items.forEach((item, i) => {
                if (i === focusedIndex) {
                    item.classList.add('focused');
                    // রিমোট দিয়ে নিচে নামলে যেন মেনু অটো স্ক্রল হয়
                    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    item.classList.remove('focused');
                }
            });
        }

        // চ্যানেল লিস্ট রেন্ডার
        const channelListContainer = document.getElementById('channelList');
        channels.forEach((channel, index) => {
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerText = channel.name;
            channelListContainer.appendChild(item);
        });

        // অটো গাইড ৫ সেকেন্ড পর গায়েব হবে
        setTimeout(() => {
            document.getElementById('remote-guide').style.display = 'none';
        }, 6000);

        // প্রথম চ্যানেল চালু করা
        playChannel(0);


        // ================== ১০০% ইউনিভার্সাল রিমোট কি-বোর্ড লজিক ==================
        document.addEventListener('keydown', function(e) {
            // ইউনিভার্সাল রিমোটের বিভিন্ন ব্র্যান্ডের কী-কোড ম্যাপিং
            const keyCode = e.keyCode || e.which;
            
            // কি-কোড লিস্ট (টিভি ও অ্যান্ড্রয়েড স্ট্যান্ডার্ড)
            const KEY_UP = 38;
            const KEY_DOWN = 40;
            const KEY_LEFT = 37;
            const KEY_RIGHT = 39;
            const KEY_ENTER = 13;
            const KEY_BACK = 27;     // ESC / Universal Back
            const KEY_ANDROID_BACK = 4; // Pure Android Remote Back
            
            // রিমোটের যেকোনো বোতাম চাপলে মাউসের ফ্রিজ অবস্থা কেটে কোড কাজ শুরু করবে
            e.preventDefault(); 

            if (isMenuOpen) {
                // ১. মেনু খোলা থাকা অবস্থায় রিমোটের কাজ:
                if (keyCode === KEY_UP) { 
                    // ওপরের বাটন চাপলে
                    focusedIndex = (focusedIndex > 0) ? focusedIndex - 1 : channels.length - 1;
                    updateFocusUI();
                } 
                else if (keyCode === KEY_DOWN) { 
                    // নিচের বাটন চাপলে
                    focusedIndex = (focusedIndex < channels.length - 1) ? focusedIndex + 1 : 0;
                    updateFocusUI();
                } 
                else if (keyCode === KEY_ENTER) { 
                    // মাঝখানের গোল ওকে (OK) বাটন চাপলে চ্যানেল প্লে হবে
                    playChannel(focusedIndex);
                } 
                else if (keyCode === KEY_LEFT || keyCode === KEY_BACK || keyCode === KEY_ANDROID_BACK) { 
                    // বামে চাপলে বা ব্যাক বাটন চাপলে মেনু বন্ধ হবে
                    hideMenu();
                }
            } else {
                // ২. ফুল স্ক্রিন ভিডিও চলাকালীন রিমোটের কাজ:
                if (keyCode === KEY_ENTER || keyCode === KEY_UP || keyCode === KEY_DOWN) {
                    // ভিডিও চলাকালীন OK, Up বা Down চাপলেই চ্যানেল লিস্ট স্ক্রিনে চলে আসবে
                    showMenu();
                }
                else if (keyCode === KEY_RIGHT) {
                    // ডান পাশের বাটন চাপলে সরাসরি পরের চ্যানেলে চলে যাবে (মেনু খোলা ছাড়াই)
                    let next = currentChannelIndex + 1;
                    playChannel(next < channels.length ? next : 0);
                }
                else if (keyCode === KEY_LEFT) {
                    // বাম পাশের বাটন চাপলে সরাসরি আগের চ্যানেলে চলে যাবে
                    let prev = currentChannelIndex - 1;
                    playChannel(prev >= 0 ? prev : channels.length - 1);
                }
            }
        });
        // =========================================================================
    </script>
</body>
</html>
